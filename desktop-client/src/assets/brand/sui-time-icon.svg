<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">岁岁时光图标</title>
  <desc id="desc">透明背景上的立体半透明绿玉沙漏与悬浮内芯</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset=".24" stop-color="#ddf3e3" stop-opacity=".40"/>
      <stop offset=".62" stop-color="#6cab80" stop-opacity=".20"/>
      <stop offset="1" stop-color="#315f4b" stop-opacity=".50"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#effff3"/>
      <stop offset=".27" stop-color="#b9ebc7"/>
      <stop offset=".70" stop-color="#5da778"/>
      <stop offset="1" stop-color="#2c614b"/>
    </radialGradient>
    <filter id="object-shadow" x="-45%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="7" dy="16" stdDeviation="10" flood-color="#183d2f" flood-opacity=".29"/>
    </filter>
    <filter id="ground-blur" x="-40%" y="-300%" width="180%" height="700%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="core-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="scale(3.10303)">
    <circle cx="176" cy="154" r="112" fill="#b9dbc3" fill-opacity=".30"/>
    <circle cx="164" cy="145" r="99" fill="#eaf6ed" fill-opacity=".36"/>
    <ellipse cx="165" cy="269" rx="113" ry="18" fill="#285b45" fill-opacity=".27" filter="url(#ground-blur)"/>
    <g transform="translate(165 157)" filter="url(#object-shadow)">
      <path d="M-115-111H114L42-8l72 108H-115L-42-8z" fill="#245940" fill-opacity=".74" transform="translate(23 18)"/>
      <path d="M-115-111H114L42-8l72 108H-115L-42-8z" fill="#edfff1" fill-opacity=".33" stroke="#80bd94" stroke-opacity=".92" stroke-width="8"/>
      <path d="M-101-98H99L32-8l67 95H-101l67-95z" fill="url(#glass)" fill-opacity=".52"/>
      <path d="M-115-111H114L99-86H-99z" fill="#4f9270"/>
      <path d="M-115 100H114L99 124H-99z" fill="#3a7659"/>
      <path d="M-43-8h86L17 23h-34z" fill="#f5fff6" fill-opacity=".75"/>
      <circle r="51" fill="#b5e4c2" fill-opacity=".47" filter="url(#core-glow)"/>
      <circle r="36" fill="url(#core)"/>
      <path d="M-13-25c18-15 39-7 44 8-13-8-26-4-37 10z" fill="#f7fff8" fill-opacity=".94"/>
      <path d="M-83-87-36-19-86 68" stroke="#fff" stroke-opacity=".68" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M70-74 105-108 38-8l68 108" stroke="#214e3b" stroke-opacity=".62" stroke-width="15" fill="none"/>
      <path d="M-83-98H52" stroke="#f7fff8" stroke-opacity=".72" stroke-width="8" stroke-linecap="round"/>
    </g>
    <circle cx="270" cy="59" r="13" fill="#76af88"/>
  </g>
</svg>
