<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岁岁时光 · 图标设计提案</title>
<!-- prototype:styles -->
<style>
:root{color-scheme:light;--ink:#233044;--muted:#758094;--line:#e4e7ed;--paper:#f6f7f9;--blue:#2864e9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1480px;margin:auto;padding:48px 48px 28px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:650;color:var(--muted);margin:0 0 13px}h1{font-size:34px;font-weight:650;letter-spacing:-1px;margin:0 0 12px}header p{font-size:14px;color:var(--muted);margin:0;line-height:1.8}.edition{text-align:right;font-size:12px;color:var(--muted);line-height:1.9;flex-shrink:0}.edition strong{color:var(--ink);font-weight:500}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{min-width:0;background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden}.stage{height:256px;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at 50% 90%,#e1e8f4 0,transparent 65%),#f2f5fa}.card:nth-child(2) .stage{background:radial-gradient(ellipse at 50% 90%,#e6dfd2 0,transparent 65%),#f8f5ef}.card:nth-child(3) .stage{background:radial-gradient(ellipse at 50% 90%,#cee1d9 0,transparent 65%),#eff5f2}.card:nth-child(4) .stage{background:radial-gradient(ellipse at 50% 90%,#d9d9f2 0,transparent 65%),#f2f1fa}.letter{position:absolute;top:20px;left:22px;font-size:12px;font-weight:600;color:#8791a2}.tag{position:absolute;top:17px;right:16px;background:#fff9;border:1px solid #ffffffb3;border-radius:20px;padding:5px 9px;color:#3769b5;font-size:10px}.hero-icon{width:164px;height:164px;filter:drop-shadow(0 18px 15px #23304421);transition:transform .2s}.hero-icon:hover{transform:translateY(-5px)}.body{padding:24px 22px 20px}h2{font-size:20px;margin:0 0 8px;font-weight:600;letter-spacing:.5px}.subtitle{font-size:11px;color:var(--muted);letter-spacing:1.5px}.description{font-size:13px;line-height:1.9;color:#667184;min-height:74px;margin:18px 0}.palette{display:flex;gap:5px;margin-bottom:22px}.swatch{height:6px;width:26px;border-radius:8px;border:1px solid #00000006}.size-row{display:flex;align-items:center;gap:19px;border-top:1px solid #edf0f4;padding:18px 0 16px;min-height:92px}.size-sample{display:flex;flex-direction:column;align-items:center;gap:8px}.size-sample span{color:#9099a7;font-size:10px}.size-sample img{display:block}.asset-links{display:flex;gap:15px;border-top:1px solid #edf0f4;padding-top:14px}a{font-size:11px;color:#546a89;text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible{outline:3px solid #82afff;outline-offset:4px}.applications{margin-top:32px}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.section-head h2{font-size:15px;letter-spacing:0}.section-head p{margin:0;color:var(--muted);font-size:11px}.platforms{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}.platform{padding:20px 22px;border-radius:18px;border:1px solid var(--line);background:#fff;min-width:0}.platform.dark{background:#242d3d;border-color:#242d3d;color:#e6eaf2}.platform-label{font-size:10px;letter-spacing:1px;color:#8c96a6;margin-bottom:20px}.dock{display:flex;gap:21px;align-items:center;justify-content:center;height:62px}.dock img{width:52px;height:52px;filter:drop-shadow(0 5px 3px #17223321)}.dark .dock img{filter:drop-shadow(0 5px 3px #0004)}.android .dock img{filter:none;transition:clip-path .2s}.android[data-mask="circle"] .dock img{clip-path:circle(50%)}.android[data-mask="square"] .dock img{clip-path:inset(0 round 14%)}.mask-controls{display:flex;gap:5px}.mask-controls button{font:inherit;font-size:10px;border:1px solid var(--line);color:#758094;background:white;padding:5px 9px;border-radius:8px;cursor:pointer}.mask-controls button[aria-pressed="true"]{background:#edf3ff;color:#2864e9;border-color:#cddfff}.android-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}.android-head .platform-label{margin:0}footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);margin-top:30px;padding-top:18px;font-size:11px;line-height:1.8;color:#8b94a2}footer strong{font-weight:500;color:#64738a}@media(min-width:1100px){.stage{height:268px}}@media(max-width:1099px){main{padding:32px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.platforms{grid-template-columns:1fr}.description{min-height:50px}.stage{height:238px}}@media(max-width:560px){main{padding:26px 18px}header{align-items:flex-start;flex-direction:column;gap:12px}h1{font-size:28px}.edition{text-align:left}.grid{grid-template-columns:1fr;gap:20px}.stage{height:244px}.hero-icon{width:160px;height:160px}.body{padding:22px}.description{min-height:0}.section-head{align-items:flex-start;flex-direction:column;gap:6px}.dock{gap:22px}footer{flex-direction:column;gap:5px}}
</style>
</head>
<body>
<main>
<header>
<div><p class="eyebrow">岁岁时光 / 品牌视觉探索</p><h1>让每一天，有自己的节奏。</h1><p>四种图标方向，为待办、日程与日复一日的小小积累而设计。</p></div>
<div class="edition"><strong>桌面端 × 移动端</strong><br>原创矢量 · 候选提案 · 尚未替换正式图标</div>
</header>
<section class="grid" aria-label="四款候选图标"></section>
<section class="applications" aria-label="跨平台图标效果">
<div class="section-head"><h2>放进日常使用的场景</h2><p>同一图形 · 深浅背景 · 安卓遮罩预览</p></div>
<div class="platforms">
<div class="platform"><div class="platform-label">桌面 / 浅色背景</div><div class="dock" data-icons></div></div>
<div class="platform dark"><div class="platform-label">桌面 / 深色背景</div><div class="dock" data-icons></div></div>
<div class="platform android" data-mask="circle"><div class="android-head"><div class="platform-label">安卓 / 形状预览</div><div class="mask-controls" role="group" aria-label="安卓图标遮罩"><button type="button" data-action="mask" data-mask="circle" aria-pressed="true">圆形</button><button type="button" data-action="mask" data-mask="square" aria-pressed="false">圆角</button></div></div><div class="dock" data-icons></div></div>
</div>
</section>
<footer><div><strong>建议优先看 A · 时光勾选</strong>，它最直接地把“时间安排”和“事项完成”合为一个符号。</div><div>本页为视觉提案；系统图标适配在选款后进行。</div></footer>
</main>
<!-- prototype:scripts -->
<script>
const concepts = [
 {id:'time-check',letter:'A',name:'时光勾选',subtitle:'安排时间，也完成事情',description:'把一天的时间弧与完成勾合为一体。清晰、轻快，一眼传达时间规划与待办的核心用途。',colors:['#2864e9','#a8ceff','#fbfdff'],recommended:true},
 {id:'day-fold',letter:'B',name:'日历折页',subtitle:'把计划，翻成每一天',description:'一页日历、一处折角、一个完成勾。贴近周月规划，让安排生活这件事更具体，也更亲切。',colors:['#2454d1','#bfdaff','#f5b267','#fffcf6']},
 {id:'daily-sprout',letter:'C',name:'岁岁新芽',subtitle:'每一点积累，都在生长',description:'用新芽与轻盈的时间弧表达日常积累。比效率工具更温暖，呼应“岁岁”持续生长的意味。',colors:['#0e403d','#87cfad','#ecf8d8']},
 {id:'time-ribbon',letter:'D',name:'时光丝带',subtitle:'让日子，自然衔接',description:'把时光折成一条柔和的 S 形丝带。弱化工具感，强调流动、秩序与更独立的品牌辨识度。',colors:['#4347ae','#727af0','#c6ddff','#ffffff']}
];
const icon = (c,size,extra='') => `<img src="assets/${c.id}.svg" alt="${c.name}" width="${size}" height="${size}" ${extra}>`;
document.querySelector('.grid').innerHTML = concepts.map(c => `<article class="card"><div class="stage"><span class="letter">${c.letter} / 04</span>${c.recommended?'<span class="tag">优先推荐</span>':''}${icon(c,164,'class="hero-icon"')}</div><div class="body"><h2>${c.name}</h2><div class="subtitle">${c.subtitle}</div><p class="description">${c.description}</p><div class="palette" aria-hidden="true">${c.colors.map(color=>`<span class="swatch" style="background:${color}"></span>`).join('')}</div><div class="size-row">${[16,32,48].map(size=>`<div class="size-sample">${icon(c,size)}<span>${size} px</span></div>`).join('')}</div><div class="asset-links"><a href="assets/${c.id}.svg" download>下载 SVG ↗</a><a href="assets/${c.id}.png" download>下载高清 PNG ↗</a></div></div></article>`).join('');
document.querySelectorAll('[data-icons]').forEach(el=>{el.innerHTML=concepts.map(c=>icon(c,52)).join('')});
document.addEventListener('click',event=>{const button=event.target.closest('[data-action="mask"]');if(!button)return;const panel=button.closest('.android');panel.dataset.mask=button.dataset.mask;panel.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))});
</script>
</body>
</html>
